appId: io.github.lukdoto.brammp4
productName: brammp4
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: vendor/bin
    to: bin
  - from: vendor/mpv
    to: mpv
    # o app chama mpv.exe direto; os .bat de associação de arquivos e o mpv.com de console não vão no instalador
    filter: ['**/*', '!mpv-register.bat', '!mpv-unregister.bat', '!mpv.com']
  - from: vendor/mpv-config
    to: mpv-config
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: brammp4-Setup-${version}.${ext}
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
publish: null
