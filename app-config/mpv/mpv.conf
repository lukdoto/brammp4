# brammp4: configuração do mpv do app (versionada e revisada como código).
# scripts/fetch-binaries.mjs copia app-config/mpv/ por cima de vendor/mpv-config/,
# que vai para resources/mpv-config no instalador e é passado ao mpv com --config-dir.

# O progresso é do app: o mpv não guarda nem restaura pontos próprios (Shift+Q, watch_later).
resume-playback=no
save-position-on-quit=no

# Arrastar um arquivo para a janela não pode trocar o vídeo que está tocando.
drag-and-drop=no

# Só valem as teclas do input.conf ao lado (nenhuma abre, troca ou apaga arquivos).
input-default-bindings=no
