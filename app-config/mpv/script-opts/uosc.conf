# brammp4: só as opções do uosc que o app muda; todo o resto fica no padrão do uosc 5.13.0.
# O player abre um arquivo só: a barra não tem prev, items, next, shuffle nem loop-playlist
# (o "next" do uosc carregaria o próximo arquivo da pasta no mesmo mpv).
controls=menu,gap,<video,audio>subtitles,<has_many_audio>audio,<has_many_video>video,<has_many_edition>editions,<stream>stream-quality,gap,space,<video,audio>speed,space,loop-file,gap,fullscreen

# textos do próprio uosc (menus de áudio e legenda) em português
languages=pt,en
