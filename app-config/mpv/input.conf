# brammp4: teclas do player (arquivo do app, revisado como código).
# Com input-default-bindings=no (mpv.conf), só valem as teclas abaixo.
# Regra: nenhum comando aqui abre, troca ou apaga arquivos nem anda na playlist
# (nada de loadfile, playlist-next/prev, delete-file, open-file).
# Os comentários "#!" montam o menu do uosc (botão de menu e clique direito);
# linhas com a tecla "#" são só itens de menu, sem atalho.

MBTN_RIGHT    script-binding uosc/menu
MENU          script-binding uosc/menu

SPACE         cycle pause                       #! Pausar ou retomar
p             cycle pause
PLAYPAUSE     cycle pause
#             script-binding uosc/audio         #! Áudio
#             script-binding uosc/subtitles     #! Legendas
SHARP         cycle audio
j             cycle sub
J             cycle sub down
f             cycle fullscreen                  #! Tela cheia
MBTN_LEFT_DBL cycle fullscreen
ESC           set fullscreen no

RIGHT         seek 5                            #! Avançar e voltar > Avançar 5 s
LEFT          seek -5                           #! Avançar e voltar > Voltar 5 s
UP            seek 60                           #! Avançar e voltar > Avançar 1 min
DOWN          seek -60                          #! Avançar e voltar > Voltar 1 min

]             add speed 0.1                     #! Velocidade > Mais rápido
[             add speed -0.1                    #! Velocidade > Mais devagar
BS            set speed 1                       #! Velocidade > Normal

m             cycle mute                        #! Volume > Sem som
0             add volume 2                      #! Volume > Aumentar
9             add volume -2                     #! Volume > Diminuir
WHEEL_UP      add volume 2
WHEEL_DOWN    add volume -2

q             quit                              #! Fechar o player
Q             quit
CLOSE_WIN     quit
